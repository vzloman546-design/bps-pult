<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta id="themeColor" name="theme-color" content="#f4f4f2" />
  <meta name="color-scheme" content="light dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="БПС Пульт" />
  <meta name="description" content="Локальный рабочий журнал инженера билетно-пропускной системы" />
  <script>
    (() => {
      let preference = 'system';
      try { preference = localStorage.getItem('bps-theme') || 'system'; } catch (_) {}
      const dark = preference === 'dark' || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      const color = dark ? '#0e100f' : '#f4f4f2';
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.style.backgroundColor = color;
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      const themeMeta = document.getElementById('themeColor');
      if (themeMeta) themeMeta.setAttribute('content', color);
    })();
  </script>
  <style>
    html,body{margin:0;background:#f4f4f2}
    html[data-theme="dark"],html[data-theme="dark"] body{background:#0e100f}
  </style>
  <link rel="manifest" href="./manifest.webmanifest?v=2.5.1" />
  <link id="appFavicon" rel="icon" href="./favicon-light-32.png?v=2.5.1" type="image/png" sizes="32x32" />
  <link id="appleTouchIcon" rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-light.png?v=2.5.1" />
  <script>
    (() => {
      const dark = document.documentElement.dataset.theme === 'dark';
      const suffix = dark ? 'dark' : 'light';
      document.getElementById('appFavicon')?.setAttribute('href', `./favicon-${suffix}-32.png?v=2.5.1`);
      document.getElementById('appleTouchIcon')?.setAttribute('href', `./apple-touch-icon-${suffix}.png?v=2.5.1`);
    })();
  </script>
  <link rel="stylesheet" href="./styles.css?v=2.5.1" />
  <title>БПС Пульт</title>
</head>
<body>
  <div id="offlineBar" class="offline-bar" hidden>Нет сети — приложение работает локально</div>
  <div id="updateBar" class="update-bar" hidden><span>Доступна новая версия</span><button type="button" id="applyUpdate">Обновить</button><button type="button" id="dismissUpdate" aria-label="Отложить обновление">Позже</button></div>

  <div class="app-shell">
    <header class="app-header">
      <div>
        <div class="eyebrow">БПС ПУЛЬТ</div>
        <h1 id="pageTitle">Сегодня</h1>
      </div>
      <div class="header-actions">
        <button class="icon-button" id="globalSearchBtn" aria-label="Открыть глобальный поиск" title="Поиск"><span data-icon="search"></span></button>
        <button class="icon-button" id="themeQuickBtn" aria-label="Переключить тему" title="Тема"></button>
      </div>
    </header>

    <main id="appMain" class="app-main" tabindex="-1"></main>
  </div>

  <nav class="bottom-nav" aria-label="Основная навигация">
    <button class="nav-button active" data-route="today" aria-label="Сегодня"><span class="nav-icon" data-icon="home"></span><span>Сегодня</span></button>
    <button class="nav-button" data-route="journal" aria-label="Журнал"><span class="nav-icon" data-icon="journal"></span><span>Журнал</span></button>
    <button class="record-button" id="recordButton" aria-label="Быстро создать"><span class="record-icon" data-icon="plus"></span><span>Создать</span></button>
    <button class="nav-button" data-route="inspections" aria-label="Техосмотры"><span class="nav-icon" data-icon="inspection"></span><span>Осмотры</span></button>
    <button class="nav-button" data-route="more" aria-label="Ещё"><span class="nav-icon" data-icon="more"></span><span>Ещё</span></button>
  </nav>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>

  <template id="modalTemplate">
    <div class="modal-backdrop" data-modal-backdrop>
      <section class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle" data-sheet tabindex="-1">
        <div class="sheet-handle-zone" data-sheet-handle aria-hidden="true"><div class="sheet-handle"></div></div>
        <header class="modal-header" data-sheet-handle>
          <button class="text-button" data-modal-close>Отмена</button>
          <h2 id="modalTitle"></h2>
          <div class="modal-header-action"></div>
        </header>
        <div class="modal-body"></div>
      </section>
    </div>
  </template>

  <script src="./stability-logic.js?v=2.5.1" defer></script>
  <script src="./event-logic.js?v=2.5.1" defer></script>
  <script src="./knowledge-logic.js?v=2.5.1" defer></script>
  <script src="./productivity-logic.js?v=2.5.1" defer></script>
  <script src="./app.js?v=2.5.1" defer></script>
  <script src="./event-ui.js?v=2.5.1" defer></script>
  <script src="./knowledge-ui.js?v=2.5.1" defer></script>
</body>
</html>
