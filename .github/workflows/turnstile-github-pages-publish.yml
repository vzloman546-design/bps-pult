name: Publish Turnstile Team to GitHub Pages

on:
  workflow_run:
    workflows:
      - Turnstile Team Check
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: turnstile-github-pages-production
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'feature/turnstile-team-workflow'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout tested team PWA source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'feature/turnstile-team-workflow' }}
          path: source

      - name: Build static PWA
        env:
          TURNSTILE_API_BASE: https://turnstile-inspection-api.vzloman546.workers.dev
        run: |
          bash source/turnstile-inspection/pages-build.sh
          test -f source/turnstile-inspection/pages-dist/index.html
          test -f source/turnstile-inspection/pages-dist/team-config.js
          test -f source/turnstile-inspection/pages-dist/sw.js
          grep -F 'https://turnstile-inspection-api.vzloman546.workers.dev' source/turnstile-inspection/pages-dist/team-config.js >/dev/null

      - name: Checkout GitHub Pages source branch
        uses: actions/checkout@v6
        with:
          ref: main
          path: site

      - name: Update published team PWA
        env:
          TEAM_SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'manual' }}
        run: |
          rm -rf site/turnstile-team
          mkdir -p site/turnstile-team
          cp -a source/turnstile-inspection/pages-dist/. site/turnstile-team/

          cd site
          git add -A turnstile-team

          if git diff --cached --quiet; then
            echo "Published files are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish team PWA from ${TEAM_SOURCE_SHA}"
          git push origin HEAD:main
