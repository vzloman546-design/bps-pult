name: Turnstile Team CI

on:
  push:
    branches:
      - feature/turnstile-team-workflow
    paths:
      - "turnstile-inspection/**"
      - ".github/workflows/turnstile-team-ci.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check frontend JavaScript
        working-directory: turnstile-inspection
        run: |
          node --check team-config.js
          node --check team-storage.js
          node --check team-api.js
          node --check team-ui.js
          node --check pdf-renderer.js
          node --check team-app.js
          node --check sw.js

      - name: Validate D1 schema
        working-directory: turnstile-inspection/cloudflare
        run: sqlite3 :memory: < schema.sql

      - name: Install Worker dependencies
        working-directory: turnstile-inspection/cloudflare
        run: npm install --no-audit --no-fund

      - name: Dry-run Worker build
        working-directory: turnstile-inspection/cloudflare
        run: npx wrangler deploy --dry-run --config wrangler.ci.toml --outdir .worker-build
