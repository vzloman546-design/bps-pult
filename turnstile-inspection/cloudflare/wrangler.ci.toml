name = "turnstile-inspection-api-ci"
main = "src/worker.js"
compatibility_date = "2026-09-26"

[vars]
ALLOWED_ORIGIN = "https://example.pages.dev"
SESSION_TTL_DAYS = "30"

[[d1_databases]]
binding = "DB"
database_name = "turnstile-inspection-ci"
database_id = "00000000-0000-0000-0000-000000000001"

[[kv_namespaces]]
binding = "DOCUMENTS"
id = "00000000000000000000000000000001"

[[durable_objects.bindings]]
name = "INSPECTION_ROOM"
class_name = "InspectionRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["InspectionRoom"]
