<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b5cab">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Осмотр турникетов">
  <title>Осмотр турникетов</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon-v11.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-v11.png">
  <link rel="stylesheet" href="styles.css?v=12">
</head>
<body>
  <div class="top-shell">
    <header class="appbar">
      <div class="appbar-main">
        <div class="appbar-spacer" aria-hidden="true"></div>
        <div class="appbar-title-wrap"><h1>Осмотр турникетов</h1></div>
        <button id="installBtn" class="icon-button hidden" type="button" aria-label="Установить приложение">Установить</button>
      </div>
    </header>
    <nav id="tabs" class="tabs" aria-label="Разделы акта"></nav>
  </div>
  <main id="view" class="view"></main>
  <footer class="bottom-bar">
    <button id="prevBtn" class="btn secondary" type="button">Назад</button>
    <div id="footerProgress" class="footer-progress"></div>
    <button id="nextBtn" class="btn primary" type="button">Далее</button>
  </footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="confirmDialog" class="dialog">
    <form method="dialog">
      <h2 id="dialogTitle">Подтверждение</h2>
      <p id="dialogText"></p>
      <div class="dialog-actions">
        <button class="btn secondary" value="cancel">Отмена</button>
        <button id="dialogOk" class="btn danger" value="ok">Продолжить</button>
      </div>
    </form>
  </dialog>
  <script src="assets-init.js"></script>
  <script src="asset-page1-1.js"></script>
  <script src="asset-page2-1.js"></script><script src="asset-page2-2.js"></script>
  <script src="asset-page3-1.js"></script><script src="asset-page3-2.js"></script>
  <script src="asset-page4-1.js"></script><script src="asset-page4-2.js"></script>
  <script src="asset-page5-1.js"></script><script src="asset-page5-2.js"></script>
  <script src="asset-page6-1.js"></script>
  <script src="asset-atlas-1.js"></script><script src="asset-atlas-2.js"></script><script src="asset-atlas-3.js"></script>
  <script src="assets-meta.js"></script><script src="assets-final.js"></script>
  <script src="app.js?v=12" defer></script>

</html>
